services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: simple_rag
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d simple_rag"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
    environment: &web_environment
      DATABASE_URL: postgresql+psycopg://rag:${LOCAL_POSTGRES_PASSWORD}@db:5432/simple_rag
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?Set API_BEARER_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SOURCES_DIRECTORY: /app/sources
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sources:/app/sources:ro
    ports:
      - "127.0.0.1:${LOCAL_WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db-test:
    profiles: [test]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: simple_rag_test
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d simple_rag_test"]
      interval: 5s
      timeout: 3s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data

  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.web
      target: test
    environment:
      <<: *web_environment
      DATABASE_URL: postgresql+psycopg://rag:${LOCAL_POSTGRES_PASSWORD}@db-test:5432/simple_rag_test
      PGVECTOR_TEST_DATABASE_URL: postgresql+psycopg://rag:${LOCAL_POSTGRES_PASSWORD}@db-test:5432/simple_rag_test
    depends_on:
      db-test:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  pgdata:
