name: Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  image:
    name: Build Lambda image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Linux x86_64 image
        run: docker buildx build --platform linux/amd64 --provenance=false --load --tag simple-rag-ingestion:test .

      - name: Verify handler and CPU PyTorch imports
        run: docker run --rm --platform linux/amd64 --entrypoint /var/lang/bin/python3.12 simple-rag-ingestion:test -c 'import torch; from src.s3_ingestion_handler import lambda_handler; assert not torch.cuda.is_available()'

  infrastructure:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1

      - name: Check OpenTofu formatting
        run: tofu -chdir=infra fmt -check

      - name: Initialize OpenTofu
        run: tofu -chdir=infra init -backend=false

      - name: Validate OpenTofu
        run: tofu -chdir=infra validate

      - name: Test OpenTofu plan
        run: tofu -chdir=infra test

  test:
    name: Test Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src/ scripts/

      - name: Run tests
        run: uv run pytest
