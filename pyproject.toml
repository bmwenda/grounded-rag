[project]
name = "simple-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain-text-splitters>=0.0.1",
    "langchain-chroma>=0.4.0",
    "langchain-openai>=0.1.0",
    "chromadb>=1.5.9",
    "langchain-docling>=1.1.0",
    "python-dotenv>=1.0.1",
    "langchain>=1.3.14",
    "boto3>=1.43.108",
    "docling>=2.135.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.20.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
build-lambda-package = "scripts.build_lambda_package:main"
db = "src.db_cli:main"
profile-admin = "src.profile_admin:main"
chat-retention = "src.chat_retention:main"
ingest-sources = "scripts.ingest_sources:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
src = ["static/*.css", "static/*.html", "static/*.js"]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=2.3.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
